name: validation
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - run: mini-nids --help

  independent-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: python -m pip install -e ".[dev]"
      - run: python -m tools.generate_fixtures --out outputs/fixtures
      - run: >-
          python -m tools.compare_tshark --tshark /usr/bin/tshark
          --pcap outputs/fixtures/benign.pcap outputs/fixtures/arp.pcap
          outputs/fixtures/scan.pcap outputs/fixtures/syn.pcap outputs/fixtures/dns.pcap
          outputs/fixtures/parser-reference.pcap
          --out outputs/tshark-comparison.json
